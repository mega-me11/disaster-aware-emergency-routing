<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Route Optimizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚨 Emergency Route Optimizer</h1>
        <p>Disaster-Aware Shortest Path Navigation</p>
    </header>

    <main>
        <section class="route-box">
            <h2>Find Your Emergency Route</h2>

            <label for="start">Starting Point</label>
            <input type="text" id="start" placeholder="Enter starting location">

            <label for="destination">Destination</label>
            <input type="text" id="destination" placeholder="Enter destination">

            <label for="vehicle">Emergency Vehicle</label>
            <select id="vehicle">
                <option>Ambulance</option>
                <option>Fire Truck</option>
                <option>Police</option>
            </select>

            <button id="findRoute">Find Shortest Route</button>

            <div id="result">
                Your route information will appear here.
            </div>
        </section>
    </main>

    <footer>
        <p>DSA Project | Graph Algorithms & Emergency Navigation</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
