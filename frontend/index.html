<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Route Optimizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Emergency Route Optimizer</h1>
        <p>Disaster-Aware Shortest Path Navigation</p>
    </header>

    <main>
        <section class="route-section">
            <h2>Find Emergency Route</h2>

            <label for="start">Source:</label>
            <select id="start">
                <option value="">Select Source</option>
                <option value="A">Hospital</option>
                <option value="B">Main Junction</option>
                <option value="C">City Center</option>
            </select>

            <label for="destination">Destination:</label>
            <select id="destination">
                <option value="">Select Destination</option>
                <option value="A">Hospital</option>
                <option value="B">Main Junction</option>
                <option value="C">City Center</option>
            </select>

            <div class="buttons">
                <button id="fastest">Fastest</button>
                <button id="safest">Safest</button>
                <button id="balanced">Balanced</button>
            </div>
        </section>

        <section class="road-section">
            <h2>Road Status Update</h2>

            <label for="road">Road:</label>
            <input type="text" id="road" placeholder="Enter road name">

            <label for="status">Status:</label>
            <select id="status">
                <option value="normal">Normal</option>
                <option value="risky">Risky</option>
                <option value="flooded">Flooded</option>
                <option value="blocked">Blocked</option>
            </select>

            <button id="updateRoad">Update Road Status</button>
        </section>

        <section class="result-section">
            <h2>Route Information</h2>
            <p id="result">Select source and destination to begin.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
